<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodBloom - Home</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .page {
      max-width: 800px;
      margin: 0 auto;
      padding: 28px 20px 48px;
      text-align: center;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 24px 0;
    }

    .result-box {
      display: none;
      background: #e6ecf3;
      border-radius: 12px;
      padding: 14px;
      margin: 10px auto 18px;
      text-align: left;
    }

    .quick-links {
      margin-top: 14px;
    }

    .quick-links a {
      display: inline-block;
      margin: 6px 10px;
      text-decoration: none;
      color: #357abd;
      font-weight: 600;
    }

    .quick-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>How are you feeling today?</h1>

    <section class="mood-grid" aria-label="Mood options">
      <button data-mood="happy">Happy</button>
      <button data-mood="sad">Sad</button>
      <button data-mood="angry">Angry</button>
      <button data-mood="low">Low</button>
      <button data-mood="anxious">Anxious</button>
    </section>

    <section id="moodResult" class="result-box" aria-live="polite"></section>

    <div class="quick-links">
      <a href="message.html">Heart Dump</a>
      <a href="journal.html">Daily Journal</a>
      <a href="landing.html">Back to Landing</a>
    </div>
  </main>

  <script>
    const messages = {
      happy: "That is wonderful. Hold on to what is making today feel good.",
      sad: "It is okay to feel sad. You are not alone and this feeling will pass.",
      angry: "Take a deep breath. A short pause can help you respond with clarity.",
      low: "Low days happen. Start small and be gentle with yourself today.",
      anxious: "Try a slow breath: in for 4, hold 4, out for 6. You are safe right now."
    };

    const resultBox = document.getElementById("moodResult");
    const buttons = document.querySelectorAll("button[data-mood]");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const mood = button.getAttribute("data-mood");
        const message = messages[mood] || "Thank you for checking in with yourself.";

        localStorage.setItem("moodBloom:lastMood", mood);
        localStorage.setItem("moodBloom:lastMoodTime", new Date().toISOString());

        resultBox.textContent = message;
        resultBox.style.display = "block";
      });
    });
  </script>
</body>
</html>
