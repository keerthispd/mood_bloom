<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodBloom - Journal</title>
  <link rel="stylesheet" href="../public/style.css" />
  <script src="../public/app.js" defer></script>
</head>
<body data-page="journal">
  <header class="site-header">
    <a class="brand" href="dashboard.html">MoodBloom</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="home.html">Mood </a>
      <a href="message.html">Heart Dump</a>
    </nav>
    <div class="session-bar" data-session-bar></div>
  </header>

  <main class="page-shell content-grid">
    <section class="panel">
      <div class="section-header">
        <div class="page-title">
          <p class="eyebrow">Daily journal</p>
          <h1 data-page-greeting>Private journal entries</h1>
          <p class="section-subtitle">Write your reflection here. Visible only to you. Access your journal history at any time.</p>
        </div>
      </div>

      <div class="callout" data-journal-guest>Guest mode lets you preview the journal. Log in to save entries privately and keep a history.</div>

      <form class="field-stack" data-journal-form>
        <label class="field">
          <span>Journal entry</span>
          <textarea data-journal-input placeholder="Write about your day, your thoughts, or what you want to remember."></textarea>
        </label>

        <div class="controls">
          <button type="submit" class="button">Save journal entry</button>
          <button type="button" class="button-secondary" data-journal-clear>Clear my journal</button>
        </div>

        <div class="status" data-journal-feedback data-state="info"></div>
      </form>
    </section>

    <section class="panel">
      <div class="section-header">
        <div>
          <p class="eyebrow">Your entries</p>
          <h2>Recent reflections</h2>
        </div>
      </div>
      <div class="entries-list" data-journal-list></div>
    </section>
  </main>
</body>
</html>
