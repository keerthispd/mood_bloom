<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Journal - MoodBloom</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      margin: 10px 0 14px;
    }

    .entry-box {
      background: #e6ecf3;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      box-shadow: 1px 1px 8px rgba(0, 0, 0, 0.05);
    }

    .entry-box p {
      margin-top: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .nav a {
      margin-right: 14px;
      text-decoration: none;
      color: #357abd;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="page">
    <h2>Daily Mood Journal</h2>

    <form id="journalForm">
      <textarea id="entryInput" name="entry" placeholder="How are you feeling today?" required></textarea>
      <div class="controls">
        <button type="submit">Save Entry</button>
        <button type="button" id="clearEntries">Clear All</button>
      </div>
    </form>

    <h3>Your Past Entries</h3>
    <section id="entriesList" aria-live="polite"></section>

    <nav class="nav" aria-label="Page navigation">
      <a href="home.html">Home</a>
      <a href="message.html">Heart Dump</a>
      <a href="landing.html">Landing</a>
    </nav>
  </main>

  <script>
    const STORAGE_KEY = "moodBloom:journalEntries";
    const form = document.getElementById("journalForm");
    const input = document.getElementById("entryInput");
    const list = document.getElementById("entriesList");
    const clearBtn = document.getElementById("clearEntries");

    function readEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (error) {
        return [];
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function renderEntries() {
      const entries = readEntries();
      list.innerHTML = "";

      if (entries.length === 0) {
        list.innerHTML = "<p>No entries yet. Start your first reflection.</p>";
        return;
      }

      entries
        .slice()
        .reverse()
        .forEach((item) => {
          const box = document.createElement("div");
          box.className = "entry-box";

          const date = document.createElement("strong");
          date.textContent = new Date(item.createdAt).toLocaleString();

          const text = document.createElement("p");
          text.textContent = item.entry;

          box.appendChild(date);
          box.appendChild(text);
          list.appendChild(box);
        });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const entry = input.value.trim();
      if (!entry) {
        return;
      }

      const entries = readEntries();
      entries.push({
        entry,
        createdAt: new Date().toISOString()
      });

      saveEntries(entries);
      input.value = "";
      renderEntries();
    });

    clearBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      renderEntries();
    });

    renderEntries();
  </script>
</body>
</html>
